name: bidi-ci

# Fork-friendly CI using GitHub-hosted runners. Upstream moved ghostty to Zig
# 0.16.0, which links the current macOS SDKs, so no SDK pinning is needed.
# The stock test.yml uses org-only Namespace runners that don't exist on forks.

on:
  push:
    branches: [hebrew-bidi, ivrix-bidi-2026-09]
  workflow_dispatch: {}

jobs:
  test-lib-vt:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install zig 0.16.0
        run: |
          set -euo pipefail
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
      - name: zig version
        run: zig version
      - name: Run lib-vt tests (incl. bidi engine + adapter)
        run: zig build test-lib-vt

  # Compiles the full app (font shaper + renderer) so shaper/renderer bidi
  # changes are verified to build, and runs the bidi-related unit tests.
  # macos-15: new enough for ghostty CoreVideo usage
  # (kCVPixelFormatType_30RGB_r210).
  build-and-test-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install zig 0.16.0
        run: |
          set -euo pipefail
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
      # Ship build: universal (arm64 + x86_64) ReleaseFast GhosttyKit, no app
      # signing step (CI can't satisfy it). Universal so colleagues on Intel or
      # Apple Silicon both work.
      - name: Build GhosttyKit xcframework (shaper + renderer)
        run: |
          # Same flags as cmux's own build-ghosttykit.yml, so the artifact
          # matches the "ghostty build key" ensure-ghosttykit.sh computes
          # (<sha>-crashsubdir-cmux-crash-sentry-off-noi18n-v2).
          zig build \
            -Dcrash-report-subdir="cmux/crash" \
            -Dsentry=false \
            -Di18n=false \
            -Demit-xcframework=true \
            -Demit-macos-app=false \
            -Dxcframework-target=universal \
            -Doptimize=ReleaseFast
      - name: Run bidi + shaper unit tests
        run: zig build test -Dtest-filter=bidi
      - name: Locate + package GhosttyKit.xcframework
        run: |
          set -euo pipefail
          XCF=$(find . -maxdepth 4 -name GhosttyKit.xcframework -type d | head -1)
          echo "found: $XCF"
          test -n "$XCF"
          tar -czf GhosttyKit.xcframework.tar.gz -C "$(dirname "$XCF")" GhosttyKit.xcframework
          ls -la GhosttyKit.xcframework.tar.gz
      - name: Upload GhosttyKit artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhosttyKit-xcframework
          path: GhosttyKit.xcframework.tar.gz
          retention-days: 7
